name: hospital-management

services:

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: hospital-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "2212"
      MYSQL_DATABASE: patient_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - hospital-network
    restart: unless-stopped

  # Eureka Server
  eureka-server:
    image: eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: "8761"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    networks:
      - hospital-network
    restart: unless-stopped

  # Patient Service
  patient-service:
    image: patient-service:latest
    container_name: patient-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/patient_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "2212"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
    depends_on:
      - mysql
      - eureka-server
    networks:
      - hospital-network
    restart: unless-stopped

  # Doctor Service
  doctor-service:
    image: doctor-service:latest
    container_name: doctor-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doctor_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "2212"
    depends_on:
      - mysql
      - eureka-server
    networks:
      - hospital-network
    restart: unless-stopped

  # Appointment Service
  appointment-service:
    image: appointment-service:latest
    container_name: appointment-service
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/appointment_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "2212"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
    depends_on:
      - mysql
      - eureka-server
    networks:
      - hospital-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    image: notification-service:latest
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: "8084"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
    depends_on:
      - eureka-server
    networks:
      - hospital-network
    restart: unless-stopped

  # Auth Service
  auth-service:
    image: auth-service:latest
    container_name: auth-service
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: "8085"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "2212"
    depends_on:
      - mysql
      - eureka-server
    networks:
      - hospital-network
    restart: unless-stopped

  # API Gateway
  api-gateway:
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - patient-service
      - doctor-service
      - appointment-service
      - auth-service
    networks:
      - hospital-network
    restart: unless-stopped

networks:
  hospital-network:
    driver: bridge

volumes:
  mysql-data: