spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Gateway routes
spring.cloud.gateway.server.webflux.routes[0].id=patient-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://patient-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/patients,/patients/**

spring.cloud.gateway.server.webflux.routes[1].id=doctor-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://doctor-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/doctors,/doctors/**

spring.cloud.gateway.server.webflux.routes[2].id=appointment-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://appointment-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/appointments,/appointments/**

spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/auth,/auth/**

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.gateway.access=read-only